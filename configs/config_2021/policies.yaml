# =============================================================================
# Policy Configuration - Controls behavior changes based on symptoms and time
# =============================================================================
#
# This file defines two types of policies:
# 1. Symptom Policies: Override behavior based on disease symptoms
# 2. Temporal Policies: Override behavior during specific time periods (lockdowns, etc.)
#
# Policies are checked in order: symptom policies first, then temporal policies
# If multiple policies apply, the first matching policy is used

policies:

  # ===========================================================================
  # SYMPTOM-BASED POLICIES
  # ===========================================================================
  # These policies trigger when a person has specific disease symptoms
  # Use symptom names from disease.yaml (e.g., "mild", "severe", "hospitalised")

  symptom_policies:

    # -------------------------------------------------------------------------
    # 12 Mar 2020 (day 40) - "contain" becomes "delay". Anyone with a new
    # continuous cough or fever is told to self-isolate for 7 days. There is
    # deliberately no policy before this date: symptomatic people behaved
    # normally through February, which is what the timeline says happened.
    #
    # The window closes on 16 Mar, when household isolation supersedes it. The
    # follow-up chain mild -> severe lives entirely inside this window: a
    # closing window is a change of government instruction, not symptom
    # progression, so nothing is inherited across the 16 Mar edge. Compliance
    # is re-rolled against the superseding policy's own rate.
    # -------------------------------------------------------------------------

    - name: "isolate_when_mild"

      start_date: "2020-03-12"
      end_date: "2020-03-16"

      # Symptoms that trigger this policy
      symptoms: ["mild"]

      # Override these activities when symptoms trigger
      # Options: List of activity names, or "*" for all activities
      override_activities: ["primary_activity", "leisure"]

      # Replace with this activity
      replacement: "residence"

      compliance_rate: 0.4

      # Follow up with severe isolation if symptoms worsen
      follow_up_policy: "isolate_when_severe"
      inherit_compliance: true
      inherit_refusal: false # Let them change their mind for severe symptoms

    - name: "isolate_when_severe"

      start_date: "2020-03-12"
      end_date: "2020-03-16"

      symptoms: ["severe"]

      override_activities: ["primary_activity", "leisure"]

      replacement: "residence"

      compliance_rate: 0.8

    # -------------------------------------------------------------------------
    # 16 Mar 2020 (day 44) - household isolation. The whole household of a
    # symptomatic person is told to stay at home for 14 days.
    #
    # A SymptomPolicy acts on the person carrying the symptom, so the
    # household members are not themselves confined here - what the stronger
    # instruction buys is a higher compliance rate for the symptomatic person.
    # Confining well household members would need a policy trigger keyed on a
    # housemate's symptoms, which the engine does not have.
    #
    # No end_date: the measure runs to the end of the simulated period. The
    # mild -> severe follow-up chain is declared again inside this window, so
    # symptom progression on or after 16 Mar inherits within the window.
    # -------------------------------------------------------------------------

    - name: "isolate_household_when_mild"

      start_date: "2020-03-16"

      symptoms: ["mild"]

      override_activities: ["primary_activity", "leisure"]

      replacement: "residence"

      # Placeholder rates: household isolation was a firmer instruction than
      # the 12 Mar advice, so compliance is higher. Fit against data before
      # drawing conclusions from a run.
      compliance_rate: 0.7

      follow_up_policy: "isolate_household_when_severe"
      inherit_compliance: true
      inherit_refusal: false

    - name: "isolate_household_when_severe"

      start_date: "2020-03-16"

      symptoms: ["severe"]

      override_activities: ["primary_activity", "leisure"]

      replacement: "residence"

      compliance_rate: 0.9

    # -------------------------------------------------------------------------
    # Policy: Hospitalized -> Go to medical facility
    # -------------------------------------------------------------------------
    # Undated: hospitalisation is clinical care, not an intervention of the
    # period, so it is in force for the whole run.
    - name: "hospitalize_severe_cases"

      symptoms: ["hospitalised", "intensive_care"]

      # "*" means override ALL activities
      override_activities: "*"

      # Send to medical facility
      replacement: "medical_facility"

      # 100% compliance - hospitalized people MUST go to hospital
      compliance_rate: 1.0

  # ===========================================================================
  # TEMPORAL POLICIES (Lockdowns, restrictions, etc.)
  # ===========================================================================
  # These policies are active during specific date ranges
  # Use dates in "YYYY-MM-DD" format (relative to simulation start date)

  temporal_policies:

    # -------------------------------------------------------------------------
    # Example: National Lockdown (March-May 2020)
    # -------------------------------------------------------------------------
    - name: "first_national_lockdown"

      # Start and end dates (YYYY-MM-DD format)
      start_date: "3024-01-01"
      end_date: "3024-12-31"

      # Override these activities during lockdown
      override_activities: ["primary_activity", "leisure"]

      # Stay at residence instead
      replacement: "residence"

      compliance_rate: 1.0

    # -------------------------------------------------------------------------
    # Example: Lockdown exempting grocery venues, with a no_venue companion
    # -------------------------------------------------------------------------
    # exempt_venue_types (the ExemptFrom direction) closes every venue type
    # EXCEPT the ones listed. It only fires on people at a real Venue though:
    # walk/bike/car commuters resolve to no_venue (no Venue to check the gate
    # against), so a venue-gated primary_activity override never touches them.
    # Add a second, ungated action on the "no_venue" activity to catch that
    # traffic too — see PR #24 discussion for why the gate itself must stay
    # Absent-blind rather than treating "no venue" as "type not listed".
    # - name: "lockdown_exempt_grocery"
    #
    #   start_date: "2020-03-23"
    #   end_date: "2020-05-15"
    #
    #   override_activities: ["primary_activity"]
    #   exempt_venue_types: ["grocery"]
    #
    #   replacement: "residence"
    #
    #   compliance_rate: 0.85
    #
    # - name: "lockdown_exempt_grocery_no_venue"
    #
    #   start_date: "2020-03-23"
    #   end_date: "2020-05-15"
    #
    #   # No venue gate: this action targets the no_venue activity directly,
    #   # so walk/bike/car commuters get sent home too.
    #   override_activities: ["no_venue"]
    #
    #   replacement: "residence"
    #
    #   compliance_rate: 0.85

    # -------------------------------------------------------------------------
    # Example: School Closures
    # -------------------------------------------------------------------------
    # - name: "school_closure_spring_2020"
    #
    #   start_date: "2020-03-20"
    #   end_date: "2020-09-01"
    #
    #   # Only override school-related activities
    #   override_activities: ["primary_activity"]
    #
    #   replacement: "residence"
    #
    #   compliance_rate: 0.95
    #
    #   # Only apply to children/students
    #   applies_to:
    #     - property: "age"
    #       operator: "<"
    #       value: 18

    # -------------------------------------------------------------------------
    # Example: Partial Lockdown (November 2020)
    # -------------------------------------------------------------------------
    # - name: "second_lockdown"
    #
    #   start_date: "2020-11-05"
    #   end_date: "2020-12-02"
    #
    #   # Allow work, restrict leisure
    #   override_activities: ["leisure", "social"]
    #
    #   replacement: "residence"
    #
    #   compliance_rate: 0.80

    # -------------------------------------------------------------------------
    # Example: Regional Lockdown (only certain geographic areas)
    # -------------------------------------------------------------------------
    # - name: "regional_lockdown_london"
    #
    #   start_date: "2020-12-20"
    #   end_date: "2021-01-31"
    #
    #   override_activities: ["primary_activity", "leisure"]
    #
    #   replacement: "residence"
    #
    #   compliance_rate: 0.90
    #
    #   # Only apply in specific geographic units
    #   applies_to:
    #     - property: "geo_unit_id"
    #       operator: "in"
    #       value: [100, 101, 102, 103]  # London MGU IDs

# =============================================================================
# USAGE NOTES
# =============================================================================
#
# 1. Symptom Policy Priority:
#    - Symptom policies are checked BEFORE temporal policies
#    - This means sick people stay home even during lockdowns
#
# 2. Compliance Rates:
#    - Set to 1.0 for mandatory policies (e.g., hospitalization)
#    - Set to 0.7-0.9 for voluntary policies (e.g., self-isolation)
#    - Each person rolls independently each time slot
#
# 3. Selection Criteria (applies_to):
#    - Use to target specific demographics or groups
#    - Available properties: age, sex, geo_unit_id, properties.*, activities.*
#    - Operators: <, >, <=, >=, ==, !=, in, contains
#
# 4. Activity Names:
#    - Must match activity names in your data (residence, primary_activity, etc.)
#    - Use "*" to override all activities
#
# 5. Date Format:
#    - Dates are relative to simulation start_date in simulation.yaml
#    - Use "YYYY-MM-DD" format
#    - Or use "start_time" / "end_time" with days from start (e.g., start_time: 30.0)
#
# 6. Multiple Policies:
#    - If multiple policies apply, the FIRST matching policy wins
#    - Order policies by specificity (most specific first)
#
# 7. Disable Policies:
#    - Comment out policies you don't want
#    - Or set compliance_rate: 0.0 to disable without removing

